# XcodeGen 工程定义（v0.3：iOS 端完整 MVP）
name: WatchAIRecorder
options:
  bundleIdPrefix: com.watchairecorder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PhoneApp:
    type: application
    platform: iOS
    sources:
      - PhoneApp
    info:
      path: PhoneApp/Info.plist
      properties:
        CFBundleDisplayName: Recorder
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 仅在你主动开始录音或使用转写功能时使用麦克风，数据只保存在你的设备上。
        NSSpeechRecognitionUsageDescription: 用于将录音转换为文字，默认使用苹果语音识别服务，离线时在本机完成识别。
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchairecorder.phone
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
